<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decision Guidance Layer - Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body class="h-screen w-full m-0 p-0">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // --- Memory & Storage Layer ---
    class MemoryStore {
      static saveEpisodic(entry) {
        const episodic = JSON.parse(localStorage.getItem('dgl_episodic') || '[]');
        episodic.unshift({ ...entry, timestamp: Date.now(), frequency: 1 });
        localStorage.setItem('dgl_episodic', JSON.stringify(episodic.slice(0, 5)));
      }

      static savePersistent(prefs) {
        const current = JSON.parse(localStorage.getItem('dgl_persistent') || '{}');
        localStorage.setItem('dgl_persistent', JSON.stringify({ ...current, ...prefs }));
      }

      static retrieve(query) {
        const episodic = JSON.parse(localStorage.getItem('dgl_episodic') || '[]');
        const persistent = JSON.parse(localStorage.getItem('dgl_persistent') || '{}');
        const queryTokens = query.toLowerCase().split(/\s+/);
        const relevant = episodic.find(e => {
          const content = (e.task_type + " " + e.pattern).toLowerCase();
          return queryTokens.some(t => t.length > 3 && content.includes(t));
        });
        return {
          relevant_memory: relevant ? { task_type: relevant.task_type, preference: relevant.final_preference } : null,
          persistent_prefs: persistent
        };
      }
    }

    // --- Groq Backend Client ---
    class GroqClient {
      constructor() {
        this.baseUrl = '/api/chat';
      }
      async fetchGroq(messages, model, jsonMode = false) {
        const body = { model, messages, temperature: 0.1 };
        if (jsonMode) body.response_format = { type: "json_object" };
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error(await response.text());
        const data = await response.json();
        return data.choices[0].message.content;
      }
      async invokeJson(prompt, schemaName, memory = null) {
        let sys = `You are an AI router. Return ONLY valid JSON for ${schemaName}. 
        ClassificationSchema: { "intent_type": "decision|execution", "decision_type": "planning|ranking", "intent_confidence": 0.9 }
        ContextSchema: { "missing_information": [{"item":"str","impacts":"goal|constraints|success_metric"}], "assumptions_made": ["str"], "confidence": 0.9 }`;
        
        if (memory && memory.relevant_memory) {
          sys += `\n\nRELEVANT MEMORY: User previously performed ${memory.relevant_memory.task_type} and preferred style: ${memory.relevant_memory.preference}.`;
        }

        const res = await this.fetchGroq([{ role: "system", content: sys }, { role: "user", content: prompt }], "llama-3.1-8b-instant", true);
        return JSON.parse(res);
      }
      async invokeDecision(prompt) {
        const sys = `You are a Decision Engine. Return ONLY valid JSON matching the ranking framework schema:
        { "framework": "ranking", "options": [{"name": "string", "criteria_scores": {"impact": 10, "effort": 5, "risk": 2}, "pros": ["string"], "cons": ["string"], "score": 85}], "recommendation": "string", "reasoning": "string" }`;
        const res = await this.fetchGroq([{ role: "system", content: sys }, { role: "user", content: prompt }], "llama-3.3-70b-versatile", true);
        return JSON.parse(res);
      }
      async invokeStandardChat(prompt, memory = null) {
        let sys = "You are a helpful coding and productivity assistant.";
        if (memory && memory.relevant_memory) {
          sys += `\n\nUSER PREFERENCE: In similar past tasks, the user preferred: ${memory.relevant_memory.preference}. Adapt accordingly.`;
        }
        return await this.fetchGroq([{ role: "system", content: sys }, { role: "user", content: prompt }], "llama-3.3-70b-versatile", false);
      }
      async invokePatternDetector(prompt, memory = null) {
        const sys = `You are a Pattern Detector. Analyze if this task should be saved as a reusable SKILL.
        
        STEP 1: Classify Task Type (content_generation|analysis|automation|decision).
        STEP 2: Atomic Task Gate. If it produces a single output with no dependencies (e.g., "write a reply email"), it is a SKILL.
        STEP 3: Check for repetition. 
        
        ${memory && memory.relevant_memory ? `RELEVANT MEMORY: User has done similar ${memory.relevant_memory.task_type} tasks before.` : ''}

        Return ONLY valid JSON matching this schema:
        {
          "task_type": string,
          "is_single_step": boolean,
          "reason": "string explaining why",
          "name": "Suggested Skill Name",
          "prompt_template": "Generalized prompt template for this task"
        }`;
        const res = await this.fetchGroq([{ role: "system", content: sys }, { role: "user", content: prompt }], "llama-3.1-8b-instant", true);
        return JSON.parse(res);
      }
      async invokeAIEdit(currentData, instruction) {
        const sys = `You are an AI Editor. Modify the following JSON object based on the user's instruction. Return ONLY the modified JSON object.
        Current JSON: ${JSON.stringify(currentData)}`;
        const res = await this.fetchGroq([{ role: "system", content: sys }, { role: "user", content: instruction }], "llama-3.1-8b-instant", true);
        return JSON.parse(res);
      }

      async findMatchingSkill(query, savedSkills) {
        if (savedSkills.length === 0) return null;
        const sys = `You are a Skill Matcher. Compare the user query with the list of saved skills.
        Return ONLY valid JSON matching this schema:
        { "matched_skill_id": string|null, "confidence": float, "reason": string }
        
        Skills: ${JSON.stringify(savedSkills.map(s => ({ id: s.id, name: s.name, desc: s.description })))}`;
        
        try {
          const res = await this.fetchGroq([{ role: "system", content: sys }, { role: "user", content: query }], "llama-3.1-8b-instant", true);
          return JSON.parse(res);
        } catch (e) { return null; }
      }
    }

    // --- Sidebar Navigation ---
    const Sidebar = ({ savedSkills, onCreateManual, onReviewSaved, onRunSkill, onDeleteSkill }) => {
      return (
        <div className="w-64 bg-[#1A1A1A] border-r border-[#2D2D2D] flex flex-col h-full overflow-y-auto shrink-0">
          <div className="p-4 border-b border-[#2D2D2D]">
            <button onClick={() => window.location.reload()} className="w-full bg-[#FF6B35] hover:bg-[#FF7D4D] text-white font-bold py-2 rounded-lg flex items-center justify-center gap-2">
              <span>+</span> New Chat
            </button>
          </div>
          
          <div className="p-4 flex flex-col gap-2 border-b border-[#2D2D2D]">
            <button onClick={() => onCreateManual('skill')} className="w-full bg-transparent border border-[#3A3A3A] hover:bg-[#2D2D2D] text-white py-2 rounded-lg text-[13px] text-left px-4 transition-colors flex justify-between items-center">
              <span>Create Skill</span>
              <span className="text-[#A0A0A0]">+</span>
            </button>
          </div>

          <div className="p-4 flex-1">
            <h3 className="text-[11px] font-bold text-[#707070] uppercase tracking-wider mb-4 px-1">Saved Skills</h3>
            <div className="space-y-1">
              {savedSkills.length === 0 && <p className="text-[12px] text-[#555] px-1">No skills yet.</p>}
              {savedSkills.map((s, i) => (
                <div key={i} className="group relative">
                  <button onClick={() => onReviewSaved('skill', s)} className="w-full text-left p-2 rounded-lg text-[13px] text-[#A0A0A0] hover:text-white hover:bg-[#2D2D2D] transition-all truncate pr-12">
                    🔁 {s.name || 'Untitled Skill'}
                  </button>
                  <div className="absolute right-2 top-2 hidden group-hover:flex items-center gap-1">
                    <button onClick={(e) => { e.stopPropagation(); onRunSkill(s); }} className="bg-[#FF6B35] text-white text-[10px] px-2 py-1 rounded">Run</button>
                    <button onClick={(e) => { e.stopPropagation(); if(confirm('Delete skill?')) onDeleteSkill(s.id); }} className="text-[#A0A0A0] hover:text-red-500 text-[14px] px-1">✕</button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="p-4 border-t border-[#2D2D2D]">
            <div className="text-[11px] text-[#555] px-2 italic">Connected to Groq Cloud</div>
          </div>
        </div>
      );
    };

    // --- UI Components ---
    const ContextGapBanner = ({ missing, assumptions, onDismiss }) => {
      if (!missing?.length && !assumptions?.length) return null;
      return (
        <div className="bg-[#2D2D2D] border border-[#FFB84D] rounded-lg p-4 my-4 shadow-lg text-white">
          <div className="flex items-center gap-2 mb-3">
            <span className="text-[#FFB84D]">⚠️</span><h4 className="font-semibold text-[14px] m-0">Missing Information</h4>
          </div>
          {missing.length > 0 && (
            <ul className="ml-5 mb-3 text-[14px] text-[#A0A0A0] list-disc">
              {missing.map((item, i) => <li key={i}>{item.item || item} ({item.impacts || 'unknown'})</li>)}
            </ul>
          )}
          <button onClick={onDismiss} className="bg-transparent border border-[#3A3A3A] hover:bg-[#2D2D2D] px-4 py-2 rounded-lg text-[14px] font-semibold mt-2">Dismiss</button>
        </div>
      );
    };

    const NudgeCard = ({ payload, onDismiss, onReview }) => {
      if (payload.framework === 'ranking') {
        return (
          <div className="bg-[#242424] border border-[#2D2D2D] rounded-xl p-5 my-4 text-white shadow-lg">
            <div className="flex items-center gap-2 mb-3">
              <span>🧠</span><h4 className="font-semibold text-[16px] m-0">Decision Support</h4>
            </div>
            <div className="mb-4">
              <span className="text-[14px] text-white">→ Recommended: <strong>{payload.recommendation}</strong></span>
              <p className="text-[14px] text-[#A0A0A0] mt-2"><strong>Why:</strong> {payload.reasoning}</p>
            </div>
            <button onClick={onDismiss} className="bg-[#FF6B35] hover:bg-[#FF7D4D] text-white px-4 py-2 rounded-lg text-[14px] font-semibold">Apply Recommendation</button>
          </div>
        );
      }
      if (payload.type === 'skill_suggestion') {
        return (
          <div className="bg-[#242424] border border-[#3A3A3A] rounded-xl p-5 my-4 text-white shadow-lg flex justify-between items-center border-l-4 border-l-[#4A9EFF]">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span>💡</span><h4 className="font-semibold text-[16px] m-0">Skill Suggestion</h4>
              </div>
              <p className="text-[13px] text-[#A0A0A0]">This looks similar to your skill <strong>'{payload.name}'</strong>. Use it?</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => onReview('run_skill', payload)} className="bg-[#4A9EFF] hover:bg-[#5AAFFF] text-white px-4 py-2 rounded-lg text-[14px] font-semibold transition-colors">Use Skill</button>
              <button onClick={onDismiss} className="bg-transparent border border-[#3A3A3A] text-[#A0A0A0] px-3 py-2 rounded-lg text-[14px] hover:bg-[#2D2D2D]">Ignore</button>
            </div>
          </div>
        );
      }
      if (payload.type === 'skill') {
        return (
          <div className="bg-[#242424] border border-[#2D2D2D] rounded-xl p-5 my-4 text-white shadow-lg flex justify-between items-center border-l-4 border-l-[#FF6B35]">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span>🔁</span><h4 className="font-semibold text-[16px] m-0">Frequent task detected</h4>
              </div>
              <p className="text-[13px] text-[#A0A0A0]">You've done this a few times. Save as a reusable skill?</p>
            </div>
            <button onClick={() => onReview('skill', payload)} className="bg-transparent border border-[#FF6B35] text-[#FF6B35] hover:bg-[#FF6B35] hover:text-white px-4 py-2 rounded-lg text-[14px] font-semibold transition-colors">Review Skill</button>
          </div>
        );
      }
      return null;
    };

    const Message = ({ msg, onReview, onDismiss }) => {
      const isAssistant = msg.role === 'assistant';
      return (
        <div className={`w-full max-w-[800px] mx-auto p-5 my-4 rounded-xl ${isAssistant ? 'bg-[#1A1A1A] border border-[#2D2D2D]' : 'bg-transparent'}`}>
          <div className="flex justify-between items-center mb-3">
            <div className="flex items-center">
              <div className={`w-8 h-8 rounded-full mr-3 flex items-center justify-center font-bold ${isAssistant ? 'bg-[#FF6B35]' : 'bg-[#4A9EFF]'}`}>
                {isAssistant ? 'AI' : 'U'}
              </div>
              <span className="font-bold text-[14px] text-white">{isAssistant ? 'Claude Assistant' : 'You'}</span>
            </div>
            {msg.matchedSkill && (
              <div className="flex items-center gap-2 bg-[#2D2D2D] px-3 py-1 rounded-full border border-[#3A3A3A]">
                <span className="text-[11px] text-[#A0A0A0]">Using Skill: <strong className="text-white">{msg.matchedSkill.name}</strong></span>
                <button onClick={() => onReview('skill', msg.matchedSkill)} className="text-[10px] text-[#FF6B35] hover:underline">Edit</button>
              </div>
            )}
          </div>
          <div className="text-[16px] text-white leading-relaxed pl-11 whitespace-pre-wrap">{msg.content}</div>
          
          <div className="pl-11 mt-4">
            {msg.contextGap && <ContextGapBanner {...msg.contextGap} onDismiss={onDismiss} />}
            {msg.nudge && <NudgeCard payload={msg.nudge} onDismiss={onDismiss} onReview={onReview} />}
          </div>
        </div>
      );
    };

    // --- Right Panel Components ---
    const WorkflowPreview = ({ data, onClose }) => {
      return (
        <div className="p-6 h-full flex flex-col">
          <div className="flex justify-between items-center mb-6 border-b border-[#2D2D2D] pb-4">
            <h2 className="text-[20px] font-semibold m-0 text-white">Preview</h2>
            <button onClick={onClose} className="text-[#A0A0A0] hover:text-white">✕</button>
          </div>
          <div className="flex-1 overflow-y-auto pr-2">
            <div className="mb-6">
              <label className="block text-[12px] text-[#A0A0A0] uppercase mb-2">Details</label>
              <p className="text-[14px] text-white">{data.reason || "System generated pattern."}</p>
            </div>
          </div>
        </div>
      );
    };

    const CapabilityEditor = ({ type, data, onSave, onClose, client }) => {
      const [localData, setLocalData] = useState({ name: '', description: '', prompt_template: '', ...data });
      const [aiInput, setAiInput] = useState("");
      const [isAiEditing, setIsAiEditing] = useState(false);

      const handleAiEdit = async () => {
        if (!aiInput.trim() || !client) return;
        setIsAiEditing(true);
        try {
          const newData = await client.invokeAIEdit(localData, aiInput);
          setLocalData(newData);
          setAiInput("");
        } catch(e) { console.error("AI Edit failed", e); }
        setIsAiEditing(false);
      };

      return (
        <div className="p-6 h-full flex flex-col">
          <div className="flex justify-between items-center mb-6 border-b border-[#2D2D2D] pb-4">
            <h2 className="text-[20px] font-semibold m-0 text-white">Edit Skill</h2>
            <button onClick={onClose} className="text-[#A0A0A0] hover:text-white">✕</button>
          </div>

          <div className="flex-1 overflow-y-auto pr-2 space-y-5">
            <div>
              <label className="block text-[12px] text-[#A0A0A0] uppercase mb-1">Name</label>
              <input type="text" value={localData.name || ''} onChange={e => setLocalData({...localData, name: e.target.value})} className="w-full bg-[#1A1A1A] border border-[#3A3A3A] text-white p-2 rounded-lg outline-none focus:border-[#FF6B35]" placeholder="Skill Name" />
            </div>
            <div>
              <label className="block text-[12px] text-[#A0A0A0] uppercase mb-1">Description</label>
              <input type="text" value={localData.description || ''} onChange={e => setLocalData({...localData, description: e.target.value})} className="w-full bg-[#1A1A1A] border border-[#3A3A3A] text-white p-2 rounded-lg outline-none focus:border-[#FF6B35]" placeholder="Description" />
            </div>
            <div>
              <label className="block text-[12px] text-[#A0A0A0] uppercase mb-1">Prompt Template</label>
              <textarea rows="6" value={localData.prompt_template || localData.reason || ''} onChange={e => setLocalData({...localData, prompt_template: e.target.value})} className="w-full bg-[#1A1A1A] border border-[#3A3A3A] text-white p-2 rounded-lg outline-none focus:border-[#FF6B35]" />
            </div>
          </div>

          <div className="mt-4 pt-4 border-t border-[#2D2D2D]">
            <label className="block text-[12px] text-[#A0A0A0] uppercase mb-2">AI Refinement</label>
            <div className="flex gap-2 mb-4">
              <input type="text" value={aiInput} onChange={e => setAiInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAiEdit()} placeholder="e.g. 'Make it more formal'..." className="flex-1 bg-[#1A1A1A] border border-[#3A3A3A] text-white p-2 rounded-lg outline-none focus:border-[#FF6B35]" />
              <button onClick={handleAiEdit} disabled={isAiEditing} className="bg-[#2D2D2D] hover:bg-[#3A3A3A] text-white px-3 rounded-lg text-[13px]">{isAiEditing ? '...' : 'Apply'}</button>
            </div>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 bg-transparent border border-[#3A3A3A] hover:bg-[#2D2D2D] text-white py-3 rounded-lg font-semibold transition-colors">Cancel</button>
              <button onClick={() => { if(confirm('Delete this skill?')) { onSave('delete', localData); } }} className="bg-transparent border border-red-900/30 text-red-500 hover:bg-red-500 hover:text-white px-4 py-3 rounded-lg font-semibold transition-colors">Delete</button>
              <button onClick={() => onSave('skill', localData)} className="flex-2 bg-[#FF6B35] hover:bg-[#FF7D4D] text-white py-3 rounded-lg font-semibold transition-colors">Save Skill</button>
            </div>
          </div>
        </div>
      );
    };


    // --- Main App Layout ---
    const App = () => {
      const [messages, setMessages] = useState([{ role: 'assistant', content: 'Hello! I am your Decision Guidance layer workspace.' }]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      
      // Right Panel State
      const [panel, setPanel] = useState({ isOpen: false, view: null, type: null, data: null }); // view: 'preview' | 'edit'

      // Capabilities State
      const [savedSkills, setSavedSkills] = useState([]);

      const messagesEndRef = useRef(null);
      const executionCountRef = useRef(0);
      
      const groqClient = React.useMemo(() => new GroqClient(), []);

      const scrollToBottom = () => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      useEffect(() => { scrollToBottom(); }, [messages]);

      const handleSend = async () => {
        if (!input.trim()) return;
        const userMsg = input.trim();
        setInput("");
        setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
        setLoading(true);

        try {
          const memory = MemoryStore.retrieve(userMsg);
          
          // --- Smart Skill Matching ---
          const skillMatch = await groqClient.findMatchingSkill(userMsg, savedSkills);
          let activeSkill = null;
          let nudge = null;
          let assistantText = "";

          if (skillMatch && skillMatch.confidence > 0.85) {
            // High Confidence: Auto-apply
            activeSkill = savedSkills.find(s => s.id === skillMatch.matched_skill_id);
            assistantText = await groqClient.invokeStandardChat(`Run this skill prompt: ${activeSkill.prompt_template}. Context: ${userMsg}`, memory);
          } else if (skillMatch && skillMatch.confidence > 0.6) {
            // Medium Confidence: Suggest
            const target = savedSkills.find(s => s.id === skillMatch.matched_skill_id);
            nudge = { ...target, type: 'skill_suggestion' };
            assistantText = await groqClient.invokeStandardChat(userMsg, memory);
          } else {
            // Low Confidence: Normal DGL Logic
            const cls = await groqClient.invokeJson(userMsg, "ClassificationSchema", memory);
            const ctx = await groqClient.invokeJson(userMsg, "ContextSchema", memory);

            if (cls.intent_type === 'decision') {
              assistantText = "I detected you are making a decision. Here is a structured analysis:";
              nudge = await groqClient.invokeDecision(userMsg);
            } else {
              assistantText = await groqClient.invokeStandardChat(userMsg, memory);
              executionCountRef.current += 1;
              if (executionCountRef.current >= 2) {
                const skillOffer = await groqClient.invokePatternDetector(userMsg, memory);
                if (skillOffer && skillOffer.is_single_step) {
                  nudge = { ...skillOffer, type: 'skill' };
                }
              }
            }
          }

          setMessages(prev => [...prev, { 
            role: 'assistant', 
            content: assistantText, 
            matchedSkill: activeSkill,
            nudge 
          }]);
          
          // Save episodic memory after success
          MemoryStore.saveEpisodic({
            task_type: activeSkill ? activeSkill.name : 'chat',
            pattern: userMsg,
            final_preference: assistantText.slice(0, 50) + "..."
          });
        } catch (e) {
          setMessages(prev => [...prev, { role: 'assistant', content: `Error: ${e.message}` }]);
        }
        setLoading(false);
      };

      const handleReviewNudge = (type, payload, msgIndex) => {
        if (type === 'run_skill') {
          handleRunSkill(payload, true, msgIndex);
        } else {
          setPanel({ isOpen: true, view: 'edit', type, data: payload });
        }
      };

      const handleDismissNudge = (msgIndex) => {
        setMessages(prev => {
          const updated = [...prev];
          updated[msgIndex] = { ...updated[msgIndex], nudge: null, contextGap: null };
          return updated;
        });
      };

      const handleCreateManual = (type) => {
        setPanel({ isOpen: true, view: 'edit', type, data: { name: "", description: "", prompt_template: "" } });
      };

      const handleReviewSaved = (type, data) => {
        setPanel({ isOpen: true, view: 'edit', type, data });
      };

      const handleSaveCapability = (type, data) => {
        if (type === 'delete') {
          setSavedSkills(prev => {
            const updated = prev.filter(s => s.id !== data.id);
            localStorage.setItem('dgl_skills', JSON.stringify(updated));
            return updated;
          });
          setPanel({ isOpen: false, view: null, type: null, data: null });
          return;
        }

        setSavedSkills(prev => {
          const existingIdx = prev.findIndex(s => s.id === data.id);
          let updated;
          if (existingIdx >= 0) {
            updated = [...prev];
            updated[existingIdx] = data;
          } else {
            const newId = data.id || Date.now().toString() + Math.random().toString(36).substr(2, 9);
            updated = [...prev, { ...data, id: newId }];
          }
          localStorage.setItem('dgl_skills', JSON.stringify(updated));
          return updated;
        });
        setPanel({ isOpen: false, view: null, type: null, data: null });
      };

      const handleDeleteSkill = (id) => {
        setSavedSkills(prev => {
          const updated = prev.filter(s => s.id !== id);
          localStorage.setItem('dgl_skills', JSON.stringify(updated));
          return updated;
        });
      };


      const handleRunSkill = async (skill, isRegen = false, msgIndex = -1) => {
        setLoading(true);
        
        let userContext = "";
        if (isRegen && msgIndex > 0) {
          userContext = messages[msgIndex - 1]?.content || "";
        }

        if (!isRegen) {
          setMessages(prev => [...prev, { role: 'user', content: `Running skill: ${skill.name}` }]);
        }

        try {
          const res = await groqClient.invokeStandardChat(`Run this skill prompt: ${skill.prompt_template}. ${userContext ? `Context: ${userContext}` : ''}`);
          
          if (isRegen && msgIndex >= 0) {
            setMessages(prev => {
              const updated = [...prev];
              updated[msgIndex] = { ...updated[msgIndex], content: res, matchedSkill: skill, nudge: null };
              return updated;
            });
          } else {
            setMessages(prev => [...prev, { role: 'assistant', content: res, matchedSkill: skill }]);
          }
        } catch (e) {
          setMessages(prev => [...prev, { role: 'assistant', content: `Error running skill: ${e.message}` }]);
        }
        setLoading(false);
      };

      useEffect(() => {
        const loadedSkills = JSON.parse(localStorage.getItem('dgl_skills') || '[]');
        // Sanitize: Ensure all skills have IDs
        const sanitized = loadedSkills.map(s => s.id ? s : { ...s, id: Date.now().toString() + Math.random().toString(36).substr(2, 9) });
        setSavedSkills(sanitized);
        if (JSON.stringify(sanitized) !== JSON.stringify(loadedSkills)) {
          localStorage.setItem('dgl_skills', JSON.stringify(sanitized));
        }
      }, []);

      return (
        <div className="flex h-screen bg-[#121212] overflow-hidden">
          {/* Left Sidebar */}
          <Sidebar 
            savedSkills={savedSkills} 
            onCreateManual={handleCreateManual}
            onReviewSaved={handleReviewSaved}
            onRunSkill={handleRunSkill}
            onDeleteSkill={handleDeleteSkill}
          />
          
          {/* Main Chat Area */}
          <div className="flex-1 flex flex-col relative min-w-0">
            <div className="flex-1 overflow-y-auto p-4 pb-32">
              {messages.map((m, i) => (
                <Message 
                  key={i} 
                  msg={m} 
                  onReview={(type, payload) => handleReviewNudge(type, payload, i)} 
                  onDismiss={() => handleDismissNudge(i)}
                />
              ))}
              {loading && <div className="text-center text-[#A0A0A0] my-4 animate-pulse">Analyzing context & patterns...</div>}
              <div ref={messagesEndRef} />
            </div>

            <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#121212] via-[#121212] to-transparent">
              <div className="max-w-[800px] mx-auto flex gap-3 shadow-2xl">
                <input 
                  type="text" 
                  value={input} 
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleSend()}
                  placeholder="e.g., I need to decide between AWS and GCP..."
                  className="flex-1 bg-[#242424] border border-[#3A3A3A] text-white p-4 rounded-xl focus:border-[#FF6B35] outline-none shadow-inner"
                />
                <button 
                  onClick={handleSend} 
                  disabled={loading}
                  className="bg-[#FF6B35] hover:bg-[#FF7D4D] disabled:opacity-50 text-white px-8 py-4 rounded-xl font-bold transition-colors shadow-lg"
                >
                  Send
                </button>
              </div>
            </div>
          </div>

          {/* Right Panel / Overlay */}
          {panel.isOpen && (
            <div className="w-96 bg-[#1A1A1A] border-l border-[#2D2D2D] shrink-0 h-full shadow-[-10px_0_20px_rgba(0,0,0,0.5)] z-20 transition-all duration-300">
              {panel.view === 'preview' && <WorkflowPreview data={panel.data} onClose={() => setPanel({...panel, isOpen: false})} onEdit={(data) => setPanel({...panel, view: 'edit', data})} />}
              {panel.view === 'edit' && <CapabilityEditor type={panel.type} data={panel.data} onClose={() => setPanel({...panel, isOpen: false})} onSave={handleSaveCapability} client={groqClient} />}
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
